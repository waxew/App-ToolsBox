name: Export Android APK Signer

on:
  push:
    paths:
      - '.github/workflows/export-apksigner.yml'

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Build Tools 37
        run: sdkmanager "build-tools;37.0.0"

      - name: Package apksigner
        run: |
          mkdir -p signer/lib
          cp "$ANDROID_HOME/build-tools/37.0.0/apksigner" signer/apksigner
          cp "$ANDROID_HOME/build-tools/37.0.0/lib/apksigner.jar" signer/lib/apksigner.jar
          chmod +x signer/apksigner

      - name: Upload apksigner
        uses: actions/upload-artifact@v4
        with:
          name: android-apksigner-37
          path: signer
          if-no-files-found: error
