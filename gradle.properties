org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# AGP 9 has built-in Kotlin enabled by default. This project deliberately opts
# out while using Kotlin 2.3.21's Android + Compose plugins together.
# Remove both flags together when migrating the build to AGP built-in Kotlin.
android.builtInKotlin=false
android.newDsl=false
